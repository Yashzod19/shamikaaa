<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yash ki Khushi — A game for Shamika 🐱</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c1c1c;
    --paper:#ffffff;
    --pink:#ff7aa2;
    --lilac:#b7a4e0;
    --leaf:#79c76f;
    --sun:#ffd45e;
    --sky:#bfe6ff;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%; overflow:hidden; background:#000;}
  body{font-family:'Baloo 2', 'Patrick Hand', sans-serif; user-select:none;}

  #game{position:fixed; inset:0; overflow:hidden; background:#000;}
  #stage{position:absolute; inset:0; overflow:hidden; transition:background 1.2s ease;}

  /* ---------- generic character ---------- */
  .char{position:absolute; bottom:60px; width:120px; height:170px; transition:filter .3s;}
  .char svg{width:100%; height:100%; overflow:visible;}
  .char.flip .body-svg{transform:scaleX(-1);}
  .body-svg{transform-origin:50% 100%;}
  .walking .body-svg{animation:bob .35s infinite alternate ease-in-out;}
  @keyframes bob{from{transform:translateY(0) rotate(-1.5deg);} to{transform:translateY(-6px) rotate(1.5deg);}}
  .walking.flip .body-svg{animation:bobflip .35s infinite alternate ease-in-out;}
  @keyframes bobflip{from{transform:scaleX(-1) translateY(0) rotate(1.5deg);} to{transform:scaleX(-1) translateY(-6px) rotate(-1.5deg);}}

  /* ---------- speech bubble ---------- */
  .bubble{
    position:absolute; bottom:105%; left:50%; transform:translateX(-50%) scale(0);
    min-width:170px; max-width:260px; background:#fff; color:#111;
    border:3px solid #111; border-radius:26px; padding:12px 16px 14px;
    font-size:17px; line-height:1.25; font-weight:700; text-align:center;
    transform-origin:bottom center; transition:transform .18s ease-out; z-index:40;
    box-shadow:0 4px 0 rgba(0,0,0,.25);
  }
  .bubble::after{
    content:""; position:absolute; bottom:-14px; left:50%; transform:translateX(-50%);
    border:8px solid transparent; border-top:12px solid #111;
  }
  .bubble::before{
    content:""; position:absolute; bottom:-9px; left:50%; transform:translateX(-50%);
    border:7px solid transparent; border-top:11px solid #fff; z-index:1;
  }
  .bubble.show{transform:translateX(-50%) scale(1);}
  .bubble .who{display:block; font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--pink); margin-bottom:2px;}

  #tap-hint{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    color:#fff; font-size:14px; opacity:0; transition:opacity .4s; z-index:60;
    background:rgba(0,0,0,.45); padding:6px 14px; border-radius:20px; pointer-events:none;
    font-weight:700;
  }
  #tap-hint.on{opacity:.9; animation:pulse 1.2s infinite;}
  @keyframes pulse{0%,100%{transform:translateX(-50%) scale(1);}50%{transform:translateX(-50%) scale(1.06);}}

  /* ---------- controls ---------- */
  #controls{position:absolute; bottom:14px; left:0; right:0; display:none; justify-content:space-between; padding:0 18px; z-index:70; pointer-events:none;}
  #controls.on{display:flex;}
  .ctl{pointer-events:auto; width:64px; height:64px; border-radius:50%; border:3px solid #fff;
    background:rgba(255,255,255,.15); color:#fff; font-size:26px; font-weight:800;
    display:flex; align-items:center; justify-content:center; touch-action:none;}
  .ctl:active{background:rgba(255,255,255,.4);}

  /* ---------- start screen ---------- */
  #start-screen{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
    background:linear-gradient(180deg,#ffd9e6 0%, #e8dcff 55%, #d2f5d0 100%); text-align:center; z-index:100; padding:20px;
  }
  #start-screen h1{font-size:clamp(30px,7vw,58px); color:#3a2e4f; line-height:1.05; text-shadow:3px 3px 0 #fff;}
  #start-screen h2{font-size:clamp(16px,3.5vw,24px); color:#7a5c8f; font-weight:700;}
  #start-btn{
    margin-top:10px; font-family:inherit; font-size:26px; font-weight:800; letter-spacing:1px;
    padding:16px 52px; border-radius:50px; border:4px solid #3a2e4f; background:var(--pink); color:#fff;
    cursor:pointer; box-shadow:0 6px 0 #3a2e4f; transition:transform .1s;
  }
  #start-btn:active{transform:translateY(4px); box-shadow:0 2px 0 #3a2e4f;}
  .float-cat{position:absolute; font-size:34px; animation:floaty 4s infinite ease-in-out;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-6deg);}50%{transform:translateY(-18px) rotate(6deg);}}

  /* ---------- spotlight / torch ---------- */
  .torch{
    position:absolute; top:-10%; width:340px; height:120%; left:50%; transform:translateX(-50%);
    background:radial-gradient(ellipse 60% 45% at 50% 20%, rgba(255,255,230,.95), rgba(255,255,210,.28) 55%, transparent 75%);
    clip-path:polygon(42% 0, 58% 0, 100% 100%, 0 100%);
    opacity:0; transition:opacity 1s; pointer-events:none;
  }
  .torch.on{opacity:1;}

  .ground-line{position:absolute; bottom:58px; left:0; right:0; height:3px; background:rgba(255,255,255,.25);}

  /* ---------- door ---------- */
  #white-door{
    position:absolute; bottom:60px; right:8%; width:120px; height:220px; background:#fff;
    border:5px solid #ddd; border-radius:6px; box-shadow:0 0 60px 25px rgba(255,255,255,.75), inset 0 0 0 4px #eee;
    display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:8px; padding:12px;
  }
  #white-door div{border:3px solid #e2e2e2; border-radius:3px; background:#fafafa;}
  #white-door .knob{position:absolute; left:10px; top:50%; width:12px; height:12px; border-radius:50%; background:#caa64a; border:none;}
  .door-glow{animation:glow 2s infinite alternate;}
  @keyframes glow{from{box-shadow:0 0 50px 18px rgba(255,255,255,.6), inset 0 0 0 4px #eee;} to{box-shadow:0 0 90px 40px rgba(255,255,255,.95), inset 0 0 0 4px #eee;}}

  /* ---------- overlays / titles ---------- */
  .scene-title{
    position:absolute; top:8%; left:50%; transform:translateX(-50%); color:#fff; font-size:clamp(18px,4vw,30px);
    font-weight:800; letter-spacing:2px; text-align:center; opacity:0; transition:opacity 1s; z-index:30; text-shadow:2px 2px 0 #000; width:90%;
  }
  .scene-title.on{opacity:1;}

  #flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; transition:opacity .5s; z-index:200;}

  /* ---------- minigame HUD ---------- */
  .hud{position:absolute; top:14px; left:50%; transform:translateX(-50%); background:#fff; border:3px solid #111;
    border-radius:30px; padding:8px 22px; font-weight:800; font-size:18px; color:#111; z-index:80; text-align:center; white-space:nowrap;}
  .falling-cat{position:absolute; font-size:40px; z-index:20; filter:drop-shadow(0 3px 2px rgba(0,0,0,.2));}
  #basket{position:absolute; bottom:70px; width:110px; height:70px; z-index:25; font-size:64px; text-align:center; line-height:70px;}

  /* bowling */
  #power-wrap{position:absolute; bottom:120px; left:50%; transform:translateX(-50%); width:240px; height:26px;
    border:3px solid #fff; border-radius:20px; overflow:hidden; z-index:80; background:rgba(255,255,255,.15);}
  #power-bar{height:100%; width:0%; background:linear-gradient(90deg,#79c76f,#ffd45e,#ff6b6b);}
  #throw-btn{position:absolute; bottom:44px; left:50%; transform:translateX(-50%); z-index:80;
    font-family:inherit; font-size:20px; font-weight:800; padding:12px 36px; border-radius:40px;
    border:3px solid #fff; background:var(--pink); color:#fff; cursor:pointer;}
  .pin{position:absolute; font-size:44px; transition:transform .5s, opacity .5s; z-index:15;}
  .pin.down{transform:rotate(95deg) translateY(18px); opacity:.35;}
  #head-ball{position:absolute; width:56px; height:56px; z-index:30;}

  /* ---------- proposal ---------- */
  .big-q{position:absolute; top:14%; left:50%; transform:translateX(-50%); color:#c2185b; font-size:clamp(24px,5.5vw,44px);
    font-weight:800; text-align:center; width:92%; z-index:50; text-shadow:2px 2px 0 #fff;}
  .ans-btn{position:absolute; z-index:90; font-family:inherit; font-size:24px; font-weight:800; padding:14px 44px;
    border-radius:40px; border:4px solid #111; cursor:pointer; box-shadow:0 5px 0 #111;}
  #yes-btn{background:#79c76f; color:#fff; left:calc(50% - 160px); top:60%;}
  #no-btn{background:#ff6b6b; color:#fff; left:calc(50% + 40px); top:60%; transition:left .18s, top .18s;}

  /* ---------- bloom / flowers ---------- */
  .flower{position:absolute; transform:scale(0); transform-origin:50% 100%; z-index:10;}
  .flower.grow{animation:sprout .9s ease-out forwards;}
  @keyframes sprout{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}
  .heart{position:absolute; font-size:26px; z-index:60; animation:rise 4s linear forwards;}
  @keyframes rise{from{transform:translateY(0) scale(.6); opacity:1;} to{transform:translateY(-70vh) scale(1.4); opacity:0;}}
  #end-text{position:absolute; top:10%; left:50%; transform:translateX(-50%) scale(0); text-align:center; z-index:70; width:94%;
    transition:transform .8s cubic-bezier(.2,1.6,.4,1);}
  #end-text.on{transform:translateX(-50%) scale(1);}
  #end-text h1{font-size:clamp(30px,7vw,60px); color:#c2185b; text-shadow:3px 3px 0 #fff;}
  #end-text h2{font-size:clamp(18px,4vw,30px); color:#3a2e4f; margin-top:6px; text-shadow:2px 2px 0 #fff;}

  .zap{position:absolute; font-size:50px; z-index:45; animation:zapzap .5s ease-out forwards;}
  @keyframes zapzap{from{transform:scale(.3) rotate(0);} to{transform:scale(1.4) rotate(30deg); opacity:0;}}

  .shadow-oval{position:absolute; bottom:52px; width:90px; height:16px; background:rgba(0,0,0,.35); border-radius:50%; filter:blur(2px);}
</style>
</head>
<body>
<div id="game">
  <div id="stage"></div>
  <div id="tap-hint">tap / click to continue ▸</div>
  <div id="controls">
    <button class="ctl" id="btn-left">◀</button>
    <button class="ctl" id="btn-right">▶</button>
  </div>
  <div id="flash"></div>
</div>

<script>
/* =========================================================
   YASH KI KHUSHI — a tiny story game for Shamika's birthday
   ========================================================= */
const stage = document.getElementById('stage');
const tapHint = document.getElementById('tap-hint');
const controls = document.getElementById('controls');
const flash = document.getElementById('flash');

const W = () => stage.clientWidth;
const H = () => stage.clientHeight;
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------------- tiny sound engine (WebAudio) ---------------- */
let AC = null;
function audio(){ if(!AC){ AC = new (window.AudioContext||window.webkitAudioContext)(); } return AC; }
function beep(freq=440, dur=0.12, type='sine', vol=0.15, when=0){
  try{
    const ctx = audio();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ctx.currentTime + when);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + when + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(ctx.currentTime + when); o.stop(ctx.currentTime + when + dur + 0.05);
  }catch(e){}
}
function blip(){ beep(700, .06, 'square', .06); }
function boing(){ beep(180,.25,'sawtooth',.12); beep(120,.3 ,'sawtooth',.1,.08); }
function sparkleSnd(){ [880,1175,1568].forEach((f,i)=>beep(f,.15,'triangle',.09,i*0.07)); }
function sadSnd(){ [330,262,196].forEach((f,i)=>beep(f,.25,'sine',.1,i*0.22)); }
function meow(){ beep(660,.09,'triangle',.12); beep(880,.14,'triangle',.1,.09); }
function crash(){ beep(140,.3,'sawtooth',.2); beep(90,.4,'square',.15,.05); }

/* ---- "mur mur" speaking voices (Animal Crossing style) ---- */
const VOICES = {
  yash:    {base:200, spread:60,  type:'triangle', vol:.09, dur:.055},
  shamika: {base:360, spread:110, type:'sine',     vol:.10, dur:.05},
  baba:    {base:110, spread:35,  type:'square',   vol:.07, dur:.07},
  def:     {base:250, spread:70,  type:'triangle', vol:.08, dur:.05},
};
function voiceFor(who){
  const w = (who||'').toLowerCase();
  if(w.includes('sham')) return VOICES.shamika;
  if(w.includes('baba')) return VOICES.baba;
  if(w.includes('yash')) return VOICES.yash;
  return VOICES.def;
}
function mumble(who){
  const v = voiceFor(who);
  const f = v.base + (Math.random()-0.5)*2*v.spread;
  beep(f, v.dur, v.type, v.vol);
  // tiny second harmonic for a soft "mrr" texture
  beep(f*1.5, v.dur*0.6, 'sine', v.vol*0.35, 0.015);
}
function happyBirthdayTune(){
  // simple melody
  const N={C:262,D:294,E:330,F:349,G:392,A:440,Bb:466,C2:523};
  const seq=[[N.G,.3],[N.G,.2],[N.A,.5],[N.G,.5],[N.C2,.5],[N.Bb ? N.Bb : 466,.9],
             [N.G,.3],[N.G,.2],[N.A,.5],[N.G,.5],[N.D*2,.5],[N.C2,.9]];
  let t=0;
  seq.forEach(([f,d])=>{ beep(f,d,'triangle',.12,t); t+=d+0.06; });
}

/* ---------------- helpers ---------------- */
function makeChar(id, svg, x, opts={}){
  const el = document.createElement('div');
  el.className = 'char'; el.id = id;
  el.style.left = x + 'px';
  if(opts.bottom) el.style.bottom = opts.bottom;
  if(opts.scale) el.style.transform = `scale(${opts.scale})`;
  el.innerHTML = svg + `<div class="bubble"><span class="who"></span><span class="txt"></span></div>`;
  stage.appendChild(el);
  return el;
}

let advanceResolver = null;
let typingSkip = null;
function waitTap(){
  tapHint.classList.add('on');
  return new Promise(res=>{ advanceResolver = ()=>{ tapHint.classList.remove('on'); advanceResolver=null; res(); }; });
}
stage.addEventListener('pointerdown', ()=>{
  if(typingSkip){ typingSkip(); return; }
  if(advanceResolver){ blip(); advanceResolver(); }
});
window.addEventListener('keydown', e=>{
  if(e.key===' '||e.key==='Enter'){
    if(typingSkip){ typingSkip(); return; }
    if(advanceResolver){ blip(); advanceResolver(); }
  }
});

async function say(charEl, who, text, holdMs){
  document.querySelectorAll('.bubble.show').forEach(b=>b.classList.remove('show'));
  const b = charEl.querySelector('.bubble');
  b.querySelector('.who').textContent = who;
  const txtEl = b.querySelector('.txt');
  txtEl.textContent = '';
  b.classList.add('show');

  // typewriter with mur-mur voice
  let skipped = false;
  typingSkip = ()=>{ skipped = true; };
  const chars = Array.from(text); // emoji-safe
  for(let i=0; i<chars.length; i++){
    if(skipped){ txtEl.textContent = text; break; }
    txtEl.textContent += chars[i];
    const ch = chars[i];
    if(i % 2 === 0 && /[A-Za-z0-9?!]/.test(ch)) mumble(who);
    await wait(/[.,!?…]/.test(ch) ? 200 : 60);
  }
  typingSkip = null;

  if(holdMs){ await wait(holdMs); } else { await waitTap(); }
  b.classList.remove('show');
  await wait(120);
}

/* ---------------- walking system ---------------- */
const keys = {left:false, right:false};
window.addEventListener('keydown', e=>{ if(e.key==='ArrowLeft')keys.left=true; if(e.key==='ArrowRight')keys.right=true; });
window.addEventListener('keyup', e=>{ if(e.key==='ArrowLeft')keys.left=false; if(e.key==='ArrowRight')keys.right=false; });
function bindHold(btn, dir){
  const on = e=>{ e.preventDefault(); keys[dir]=true; };
  const off= e=>{ e.preventDefault(); keys[dir]=false; };
  btn.addEventListener('pointerdown', on);
  btn.addEventListener('pointerup', off);
  btn.addEventListener('pointerleave', off);
  btn.addEventListener('pointercancel', off);
}
bindHold(document.getElementById('btn-left'),'left');
bindHold(document.getElementById('btn-right'),'right');

function walkUntil(charEl, condition){
  controls.classList.add('on');
  return new Promise(res=>{
    let x = parseFloat(charEl.style.left)||0;
    let raf;
    function loop(){
      let moving = false;
      if(keys.right){ x += 4.4; charEl.classList.remove('flip'); moving=true; }
      if(keys.left){ x -= 4.4; charEl.classList.add('flip'); moving=true; }
      x = Math.max(-40, Math.min(W()-70, x));
      charEl.style.left = x+'px';
      charEl.classList.toggle('walking', moving);
      if(condition(x)){ charEl.classList.remove('walking'); controls.classList.remove('on'); cancelAnimationFrame(raf); res(); return; }
      raf = requestAnimationFrame(loop);
    }
    loop();
  });
}

function doFlash(color='#fff'){
  flash.style.background = color;
  flash.style.opacity = 1;
  setTimeout(()=>flash.style.opacity=0, 350);

/* =========================================================

   ========================================================= */
async function miniGameCats(){
  clearStage('linear-gradient(180deg,#bfe6ff,#e8f7ff)');
  const hud = document.createElement('div'); hud.className='hud';
  hud.textContent='CHALLENGE 1 🐱 Catch 8 cats!';
  stage.appendChild(hud);

  const info = document.createElement('div');
  info.className='hud'; info.style.top='auto'; info.style.bottom='16px'; info.style.fontSize='14px';
  info.textContent='Move with ◀ ▶ keys or drag your finger';
  stage.appendChild(info);

  const basket = document.createElement('div'); basket.id='basket'; basket.textContent='🧺';
  basket.style.left=(W()/2-55)+'px';
  stage.appendChild(basket);

  let caught=0, missed=0, running=true;
  const need=8;
  function updateHud(){ hud.textContent = `CHALLENGE 1 🐱  Caught: ${caught}/${need}   Escaped: ${missed}`; }
  updateHud();

  // basket movement
  let bx = W()/2-55;
  function moveLoop(){
    if(!running) return;
    if(keys.left) bx-=7;
    if(keys.right) bx+=7;
    bx=Math.max(0,Math.min(W()-110,bx));
    basket.style.left=bx+'px';
    requestAnimationFrame(moveLoop);
  }
  moveLoop();
  controls.classList.add('on');
  const drag = e=>{ bx = Math.max(0,Math.min(W()-110, e.clientX-55)); basket.style.left=bx+'px'; };
  stage.addEventListener('pointermove', drag);
  stage.addEventListener('pointerdown', drag);

  const catFaces=['🐱','😺','😸','🐈','😻','🐈‍⬛'];
  function spawnCat(){
    if(!running) return;
    const c=document.createElement('div');
    c.className='falling-cat';
    c.textContent=catFaces[Math.floor(Math.random()*catFaces.length)];
    let cx=Math.random()*(W()-60)+10, cy=-60;
    c.style.left=cx+'px'; c.style.top=cy+'px';
    const speed=2.6+Math.random()*2.4 + caught*0.18;
    const wob=Math.random()*2-1;
    stage.appendChild(c);
    function fall(){
      if(!running){ c.remove(); return; }
      cy+=speed; cx+=Math.sin(cy/40)*wob;
      c.style.top=cy+'px'; c.style.left=cx+'px';
      const basketTop=H()-140;
      if(cy>basketTop-20 && cy<basketTop+30 && cx>bx-20 && cx<bx+100){
        caught++; meow(); updateHud();
        c.textContent='💗'; c.style.transition='transform .3s, opacity .3s';
        c.style.transform='scale(1.6)'; c.style.opacity='0';
        setTimeout(()=>c.remove(),300);
        if(caught>=need) finish(true);
        return;
      }
      if(cy>H()){ missed++; updateHud(); c.remove(); return; }
      requestAnimationFrame(fall);
    }
    fall();
    if(running) setTimeout(spawnCat, 750+Math.random()*550);
  }
  setTimeout(spawnCat, 600);

  let finished=false;
  async function finish(){
    if(finished) return; finished=true;
    running=false;
    controls.classList.remove('on');
    stage.removeEventListener('pointermove', drag);
    stage.removeEventListener('pointerdown', drag);
    sparkleSnd(); doFlash('rgba(255,255,255,.6)');
    await wait(400);
    hud.textContent='🎉 ALL CATS SAFE! Shamika is impressed!';
    const sham = makeChar('sham', shamikaSVG(), W()*0.62-60);
    await say(sham,'Shamika','Wowww, my cats love you already 😻 Okay... ONE more challenge!');
    miniGameBowling();
  }
}

  yash.style.transition='left 1s ease'; sham.style.transition='left 1s ease';
  yash.style.left=(W()/2-95)+'px';
  sham.style.left=(W()/2-15)+'px';
  await wait(1100);
  sparkleSnd();

  // bloom!
  stage.style.transition='background 3s ease';
  stage.style.background='linear-gradient(180deg,#bfe6ff 0%, #d8f3d0 45%, #8fd07e 100%)';
  happyBirthdayTune();

  const types=['daisy','lav','pink','daisy','lav','daisy'];
  const count = Math.min(60, Math.floor(W()/14));
  for(let i=0;i<count;i++){
    setTimeout(()=>{
      const f=document.createElement('div'); f.className='flower';
      const t=types[Math.floor(Math.random()*types.length)];
      const size=28+Math.random()*36;
      f.style.width=size+'px'; f.style.height=size*1.6+'px';
      f.style.left=Math.random()*(W()-40)+'px';
      f.style.bottom=(20+Math.random()*130)+'px';
      f.innerHTML=flowerSVG(t);
      stage.appendChild(f);
      requestAnimationFrame(()=>f.classList.add('grow'));
    }, i*90);
  }
  // a few cats in the meadow
  const catCols=['#3b3b3b','#e89b3c','#777','#fff'];
  for(let i=0;i<4;i++){
    setTimeout(()=>{
      const c=document.createElement('div');
      c.style.cssText=`position:absolute; width:${60+Math.random()*30}px; height:50px; bottom:${30+Math.random()*90}px; left:${Math.random()*(W()-80)}px; z-index:12; transform:scale(0); transition:transform .6s cubic-bezier(.2,1.6,.4,1);`;
      c.innerHTML=catSVG(catCols[i%catCols.length]);
      stage.appendChild(c); meow();
      requestAnimationFrame(()=>c.style.transform='scale(1)');
    }, 1200+i*500);
  }
  // hearts forever
  const heartTimer=setInterval(()=>{
    const h=document.createElement('div'); h.className='heart';
    h.textContent=['💗','💖','💕','🐾','✨'][Math.floor(Math.random()*5)];
    h.style.left=Math.random()*W()+'px'; h.style.bottom='120px';
    stage.appendChild(h);
    setTimeout(()=>h.remove(),4100);
  }, 380);

  await wait(2600);
  const end=document.createElement('div'); end.id='end-text';
  end.innerHTML=`<h1>I LOVE YOU CHOTUUUUUU 💗</h1>
    <h2>Happy Birthday Shamika 🎂🐱</h2>
    <h2 style="margin-top:14px; font-size:16px; color:#5b4a72">— forever yours, Yash ✨</h2>
    <button id="replay" style="margin-top:18px; font-family:inherit; font-size:18px; font-weight:800; padding:10px 30px; border-radius:40px; border:3px solid #3a2e4f; background:#fff; color:#3a2e4f; cursor:pointer; box-shadow:0 4px 0 #3a2e4f;">↻ Play again</button>`;
  stage.appendChild(end);
  requestAnimationFrame(()=>end.classList.add('on'));
  document.getElementById('replay').onclick=()=>{ clearInterval(heartTimer); sceneStart(); };
}

/* ---------------- boot ---------------- */
sceneStart();
</script>
</body>
</html>
